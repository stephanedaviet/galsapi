<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#090b14" />
    <meta
      name="description"
      content="GALSAPI — une idée qui prend vie."
    />
    <title>GALSAPI — Une idée qui prend vie</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #090b14;
        color: #f7f7fb;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100svh;
        margin: 0;
        overflow: hidden;
      }

      main {
        position: relative;
        display: grid;
        min-height: 100svh;
        overflow: hidden;
        place-items: center;
        isolation: isolate;
        background:
          radial-gradient(ellipse at 50% 44%, rgb(37 34 71 / 42%), transparent 48%),
          linear-gradient(145deg, #0d101c 0%, #090b14 55%, #10101e 100%);
      }

      main::before,
      main::after {
        position: absolute;
        z-index: -1;
        width: min(62vw, 680px);
        aspect-ratio: 1;
        border: 1px solid rgb(255 255 255 / 5%);
        border-radius: 50%;
        content: "";
        animation: orbit 28s linear infinite;
      }

      main::after {
        width: min(82vw, 900px);
        animation-direction: reverse;
        animation-duration: 38s;
      }

      .glow {
        position: absolute;
        z-index: -1;
        width: min(36vw, 390px);
        aspect-ratio: 1;
        border-radius: 50%;
        background: #8d5cff;
        filter: blur(130px);
        opacity: 0.18;
        animation: breathe 6s ease-in-out infinite alternate;
      }

      .content {
        padding: 2rem;
        text-align: center;
      }

      .eyebrow {
        margin: 0 0 1.4rem;
        color: #9da2ba;
        font-size: clamp(0.65rem, 1.4vw, 0.75rem);
        font-weight: 600;
        letter-spacing: 0.34em;
        text-transform: uppercase;
        animation: rise-in 800ms 100ms both cubic-bezier(0.2, 0.8, 0.2, 1);
      }

      h1 {
        display: flex;
        justify-content: center;
        gap: 0.025em;
        margin: 0;
        font-size: clamp(3.3rem, 13.5vw, 10.5rem);
        font-weight: 800;
        letter-spacing: -0.085em;
        line-height: 0.95;
      }

      .syllable {
        display: inline-block;
        opacity: 0;
        transform: translateY(0.55em) scale(0.92);
        animation: syllable-in 900ms forwards cubic-bezier(0.16, 1, 0.3, 1);
      }

      .syllable:nth-child(1) {
        color: #a78bfa;
        text-shadow: 0 0 55px rgb(167 139 250 / 36%);
        animation-delay: 250ms;
      }

      .syllable:nth-child(2) {
        color: #67e8d3;
        text-shadow: 0 0 55px rgb(103 232 211 / 28%);
        animation-delay: 480ms;
      }

      .syllable:nth-child(3) {
        color: #ff9a76;
        text-shadow: 0 0 55px rgb(255 154 118 / 28%);
        animation-delay: 710ms;
      }

      .divider {
        width: 42px;
        height: 1px;
        margin: 2rem auto 1.25rem;
        background: linear-gradient(90deg, transparent, #626680, transparent);
        animation: fade-in 900ms 900ms both;
      }

      .tagline {
        margin: 0;
        color: #a2a5b8;
        font-size: clamp(0.85rem, 2vw, 1rem);
        font-weight: 400;
        letter-spacing: 0.04em;
        animation: rise-in 800ms 1s both cubic-bezier(0.2, 0.8, 0.2, 1);
      }

      .corner-note {
        position: absolute;
        right: 2rem;
        bottom: 1.75rem;
        left: 2rem;
        color: #63677d;
        font-size: 0.65rem;
        letter-spacing: 0.2em;
        text-align: center;
        text-transform: uppercase;
        animation: fade-in 1s 1.2s both;
      }

      @keyframes syllable-in {
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @keyframes rise-in {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes fade-in {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      @keyframes breathe {
        to {
          transform: scale(1.16);
          opacity: 0.26;
        }
      }

      @keyframes orbit {
        to {
          transform: rotate(360deg);
        }
      }

      @media (max-width: 480px) {
        .content {
          padding: 1.25rem;
        }

        h1 {
          font-size: clamp(3.1rem, 16vw, 5rem);
        }

        .corner-note {
          bottom: 1.25rem;
          font-size: 0.58rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-delay: 0ms !important;
          animation-iteration-count: 1 !important;
          scroll-behavior: auto !important;
        }

        .syllable {
          opacity: 1;
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="glow" aria-hidden="true"></div>
      <section class="content" aria-labelledby="brand">
        <p class="eyebrow">Une idée qui prend vie</p>
        <h1 id="brand" aria-label="GALSAPI">
          <span class="syllable" aria-hidden="true">GAL</span>
          <span class="syllable" aria-hidden="true">SA</span>
          <span class="syllable" aria-hidden="true">PI</span>
        </h1>
        <div class="divider" aria-hidden="true"></div>
        <p class="tagline">Le début de quelque chose de grand.</p>
      </section>
      <p class="corner-note" aria-hidden="true">Créé avec imagination&nbsp; · &nbsp;2026</p>
    </main>
  </body>
</html>
